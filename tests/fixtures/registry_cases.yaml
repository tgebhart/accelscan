# Labeled paragraph-level matcher cases. `expect` lists the model ids that
# survive local gating (no paper-level rescue, no neighbor context).
# Every false positive/negative found in pilots or audits gets added here.
cases:
  - text: "We trained on 8 NVIDIA V100 GPUs with 32GB memory each."
    expect: [generic-gpu, nvidia-v100]
  - text: "Using a Tesla-V100 accelerator via CUDA 10.1."
    expect: [generic-cuda, nvidia-v100]
  - text: "All experiments used a GeForce GTX 1080 Ti."
    expect: [nvidia-geforce-gtx-1080-ti]
  - text: "experiments ran on an RTX 3090 Ti and an RTX 3090."
    expect: [nvidia-geforce-rtx-3090, nvidia-geforce-rtx-3090-ti]
  - text: "a single K80 GPU was used for all runs"
    expect: [generic-gpu, nvidia-k80]
  - text: "implemented in OpenCL on a Radeon HD 5870"
    expect: [amd-radeon-hd-5870, generic-opencl]
  - text: "inference on TPU v3-8 pods"
    expect: [google-tpu-v3]        # specific model suppresses generic-tpu span
  - text: "MI250X GPUs on the Frontier supercomputer"
    expect: [amd-mi250x, generic-gpu]
  - text: "NVIDIA's Fermi GPU architecture doubled throughput"
    # architecture words were removed in v0.3.0: the generation is metadata on the
    # model entries, so only the brand and the generic term match here
    expect: [generic-gpu, vendor-nvidia]
  - text: "we simulated the model on 4 GPUs"
    expect: [generic-gpu]
  - text: "an Apple M2 MacBook Pro was used for analysis"
    expect: [apple-m2]        # 'M2 ... Pro' is not 'M2 Pro'
  - text: "fine-tuned on an M4 Max MacBook Pro"
    expect: [apple-m4-max]    # variant wins over the bare generation
  - text: "a Mac Studio with the M2 Ultra chip"
    expect: [apple-m2-ultra]
  - text: "training used TPUv4 chips"
    expect: [google-tpu-v4]
  - text: "an A100 80GB GPU served the model"
    expect: [generic-gpu, nvidia-a100]

  # ---- hard negatives -------------------------------------------------
  # Regressions from deriving brand triggers off the tables (v0.3.1). Each was
  # measured on an 8-shard pilot before being fixed: 'Instinct' ungated hit the
  # English word in 1,404 passages, and an insensitive 'ATI' let the automatic
  # plural 's?' swallow the S of ATIS, the airline-travel NLP dataset.
  - text: "aggression may be driven by human instinct rather than learning"
    expect: []
  - text: "maternal instincts were measured across three cohorts"
    expect: []
  - text: "we evaluate on the ATIS dataset for spoken language understanding"
    expect: []
  - text: "the aMD phase of the reaction was monitored"
    expect: []
  # ...while the real product and the mixed-case vendor spelling must still hit
  - text: "an Instinct card with 32 GB of VRAM"
    expect: [vendor-amd]
  - text: "Nvidia drivers were installed for GPU acceleration"
    expect: [generic-gpu, vendor-nvidia]
  - text: "the BMW M2 competition model drove fast"
    expect: []
  - text: "K80 cells were cultured overnight"
    expect: []
  - text: "1080p video recordings were collected"
    expect: []
  - text: "The patient's P100 latency in the ECG was elevated"
    expect: []
  - text: "the fermi surface of the material"
    expect: []
  - text: "a 3 Tesla MRI scanner acquired the images"
    expect: []
  - text: "the Turing test remains a benchmark for machine intelligence"
    expect: []
  - text: "Blaise Pascal wrote extensively on probability"
    expect: []
  - text: "M2 money supply grew by 4% year over year"
    expect: []
  - text: "the barracuda swam past the reef"
    expect: []
  - text: "IPU admission rates increased during the pandemic"
    expect: []      # intensive-care IPU must not hit graphcore-ipu without GPU context
  - text: "we train a two-layer GCN on a single GPU"
    expect: [generic-gpu]    # graph convolutional network, not AMD GCN
  # AMD architecture words were dropped in v0.3.0 (the generated AMD entries
  # carry the architecture as metadata), so nothing matches here: 'AMD' is gated
  # and this sentence has no GPU-context term.
  - text: "optimized kernels for the AMD GCN architecture"
    expect: []
  - text: "an RDNA2 GPU from AMD"
    expect: [generic-gpu, vendor-amd]    # 'RDNA2' itself contributes nothing

  # ---- one bare-code rule, both generators (v0.4.0) -------------------
  # A vendor-qualified alias is case-insensitive, so the ordinary spelling of the
  # vendor matches. Before v0.4.0 these compiled case-sensitive (every letter is
  # uppercase), which silently cost recall on export-control SKUs reported in §8.
  - text: "inference ran on a Nvidia L4 GPU"
    expect: [generic-gpu, nvidia-l4]
  - text: "trained on 8 Tesla T4 GPUs"
    expect: [generic-gpu, nvidia-tesla-t4]
  # ...but the bare code is denied for a named non-hardware meaning, in either
  # generator's output (alias_rules.BARE_CODE_DENY)
  - text: "we used a T4 for training"
    expect: []
  - text: "thyroid T4 levels were measured in serum"
    expect: []
  - text: "we ran on 8 A10 GPUs"
    expect: [generic-gpu]        # A10: the aircraft and the cell line
  - text: "an NVIDIA A10 GPU"
    expect: [generic-gpu, nvidia-a10]
  # an all-digit code is a quantity in prose, so it is never emitted bare; the
  # product line still reaches it
  - text: "four Xeon Phi 7250 processors per node"
    expect: [intel-xeon-phi-7250]
  - text: "experiments on Ascend 910 NPUs"
    expect: [generic-npu, huawei-ascend-910]
  # 4+ char codes keep their gated bare form (the rule is one rule, not a length)
  - text: "the A800 GPUs were used for pretraining"
    expect: [generic-gpu, nvidia-a800]

  # ---- gaps SH-NER surfaced (accelscan/scripts/eval_shner.py) ----------
  # A model number with a distinctive suffix needs no series prefix: '1080' alone
  # is a resolution, '1080 Ti' is only ever a GPU. Both spellings were annotated
  # hardware in SH-NER that v0.3.1 missed.
  - text: "trained on a 1080Ti GPU"
    expect: [generic-gpu, nvidia-geforce-gtx-1080-ti]
  - text: "2080 Ti GPUs were used for all runs"
    expect: [generic-gpu, nvidia-geforce-rtx-2080-ti]
  - text: "we resized every frame to 1920 1080 before the GPU pipeline"
    expect: [generic-gpu]      # a bare resolution still contributes nothing
  # papers drop the workstation line name, so 'Quadro RTX 8000' must also match
  # as 'RTX 8000'
  - text: "an RTX 8000 was used for rendering"
    expect: [nvidia-quadro-rtx-8000]

  # ---- gate behavior: bare code without local context fails ----------
  - text: "we used an A100 for training"
    expect: []      # rescued only by paper-level tier-A hit (tested in test_scan)
