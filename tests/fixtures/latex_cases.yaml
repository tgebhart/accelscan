# Raw-LaTeX search cases. The matcher reads the SOURCE; there is no de-TeXing
# (see accelscan/latex.py for why). So these cases pin two things:
#   - recall: the hardware sentence must survive, `$8$` must keep its digit,
#     every text member is searched, bibliographies are still excluded;
#   - the ACCEPTED contamination: captions, listings, tables, comments and math
#     markup are searched, and appear in `contains` on purpose. Moving one of
#     those back to `absent` is a deliberate policy change, not a bug fix.
#
# Fields: name, files{path: tex} (or `tex` for a single main.tex),
#   contains / absent   -- substrings that must (not) appear in the joined output
#   sections            -- exact list of distinct section labels, in order
#   n_paragraphs        -- exact paragraph count, when the split itself is the point
cases:
  - name: comments-are-searched-in-raw-source
    # TeX's real rule: '%' kills the rest of the line AND the newline; '\%' is a
    # literal percent. Getting this wrong either glues words or invents breaks.
    tex: |
      \begin{document}
      We ran the model on an NVIDIA V100 GPU in our lab this year.
      % a stray comment naming an A100 that must never be extracted
      Utilisation reached 95\% of peak throughput during the long training run.
      \end{document}
    # ACCEPTED: comments are searched, so the commented A100 counts as a mention.
    contains: ['NVIDIA V100', '95\% of peak', 'A100', 'stray comment']

  - name: numeric-inline-math-keeps-device-count
    # "$8$ V100s" must not become " V100s": device_count is a headline estimand.
    tex: |
      \begin{document}
      Training used $8$ NVIDIA V100 GPUs and took $2.5$ days of wall clock time.
      \end{document}
    contains: ['8 NVIDIA V100 GPUs', '2.5 days']

  - name: symbolic-inline-math-becomes-space-not-glue
    tex: |
      \begin{document}
      We set $\alpha$ to a small value and trained on one NVIDIA A100 GPU here.
      \end{document}
    # symbolic inline math still becomes a space, so words cannot glue
    contains: ['NVIDIA A100']
    absent: ['toa', 'and$']

  - name: display-math-left-in-place
    tex: |
      \begin{document}
      The loss is defined below and optimised on a single NVIDIA A100 GPU card.
      $$ L = \sum_i x_i^2 + \gamma $$
      \[ R = \frac{1}{n} \]
      Convergence took twelve hours of training on that same accelerator card.
      \end{document}
    # ACCEPTED: display math is left in the text; it never names hardware
    contains: ['NVIDIA A100', 'Convergence took twelve hours', '\sum']

  - name: figure-caption-is-searched
    # Floats go with their captions, for comparability with S2ORC body text.
    tex: |
      \begin{document}
      All experiments in this study ran on our institutional GPU cluster nodes.
      \begin{figure}[t]
      \includegraphics{arch.pdf}
      \caption{Our pipeline, benchmarked on an H100 for the appendix figure.}
      \end{figure}
      Every reported number comes from the same hardware configuration as above.
      \end{document}
    # ACCEPTED and the biggest upward bias: a caption naming an H100 makes this
    # an H100 paper at the regex stage. usage_context is the downstream defence.
    contains: ['institutional GPU cluster', 'Every reported number', 'H100']

  - name: nested-environments-need-no-handling
    # A non-greedy regex would stop at the inner \end{align} and leak the tail.
    tex: |
      \begin{document}
      We optimise the objective on a single NVIDIA V100 GPU in all experiments.
      \begin{align}
        x &= 1 \\
        \begin{aligned} y &= 2 \end{aligned}
      \end{align}
      The remaining text after the equation block must survive intact for us.
      \end{document}
    # ACCEPTED: environments are not removed, so nesting cannot be got wrong
    contains: ['NVIDIA V100', 'remaining text after the equation block', 'x &= 1']

  - name: listings-are-searched
    tex: |
      \begin{document}
      The reference implementation was benchmarked on one NVIDIA A100 GPU node.
      \begin{lstlisting}
      model.to('cuda')  # trained on a K80 in this snippet
      \end{lstlisting}
      \begin{verbatim}
      nvidia-smi output mentioning a GTX 1080 Ti card
      \end{verbatim}
      Results are averaged over five random seeds for every configuration here.
      \end{document}
    # ACCEPTED: code listings are searched, so a K80 in a comment inside a
    # snippet counts. Real effect, knowingly taken.
    contains: ['NVIDIA A100', 'averaged over five random seeds', 'K80', 'GTX 1080']

  - name: thebibliography-environment-dropped
    tex: |
      \begin{document}
      Our simulations were executed on eight NVIDIA V100 GPUs over three weeks.
      Scaling behaviour matched the analytic prediction across all node counts.
      \begin{thebibliography}{9}
      \bibitem{a} A. Author. GPU-accelerated Monte Carlo on a K80. Proc. IEEE, 2015.
      \end{thebibliography}
      \end{document}
    contains: ['NVIDIA V100']
    absent: ['K80', 'Monte Carlo', 'bibitem']

  - name: bibliography-macro-truncates-past-halfway
    tex: |
      \begin{document}
      The training runs described here used four NVIDIA A100 GPUs in parallel.
      We report throughput, memory footprint, and total energy for every run.
      Ablations repeat the protocol with a smaller batch size on the same nodes.
      \bibliography{refs}
      Nothing after the bibliography macro should be treated as body text here.
      \end{document}
    contains: ['NVIDIA A100', 'Ablations repeat the protocol']
    absent: ['Nothing after the bibliography']

  - name: early-bibliographystyle-must-not-decapitate
    # \bibliographystyle in the preamble region is NOT a body cut point; without
    # the position guard this paper would lose all of its text.
    tex: |
      \bibliographystyle{plain}
      \begin{document}
      Our benchmark suite was executed on a single NVIDIA RTX 3090 GPU machine.
      Each configuration was repeated five times to estimate run-to-run variance.
      \end{document}
    contains: ['NVIDIA RTX 3090', 'repeated five times']

  - name: input-resolved-across-members-and-bbl-ignored
    files:
      main.tex: |
        \documentclass{article}
        \begin{document}
        \input{intro}
        \input{missing_file}
        \end{document}
      intro.tex: |
        \section{Setup}
        The pipeline was trained end to end on four NVIDIA A100 GPUs per node.
      refs.bbl: |
        \bibitem{x} Someone. A K80-based renderer for volumetric data. ACM, 2014.
    contains: ['four NVIDIA A100 GPUs']
    absent: ['K80', 'renderer']
    sections: ['Setup']

  - name: zero-arg-macro-not-expanded
    tex: |
      \newcommand{\ourmodel}{FooNet}
      \begin{document}
      We trained \ourmodel{} for one week on a single NVIDIA V100 GPU instance.
      \end{document}
    # KNOWN RECALL GAP: macro bodies are not expanded, so a model name defined as
    # \newcommand{\ourmodel}{FooNet} is invisible. Hardware names in macros are rare.
    contains: ['NVIDIA V100', 'ourmodel']
    absent: ['FooNet']

  - name: section-hierarchy-and-paragraph-heading
    # \paragraph{} is a real heading in ML papers ("Implementation details").
    tex: |
      \begin{document}
      \section{Method}
      We describe the architecture and the optimiser configuration in this part.
      \subsection{Training}
      Optimisation ran for one hundred epochs on the cluster described earlier.
      \paragraph{Implementation details}
      All runs used two NVIDIA A100 GPUs with mixed precision enabled by default.
      \end{document}
    sections: ['Method', 'Training', 'Implementation details']
    contains: ['two NVIDIA A100 GPUs']

  - name: reference-shaped-paragraph-filtered
    # Final net behind the two bibliography layers: a stray reference list that
    # is not wrapped in thebibliography and has no \bibliography macro.
    tex: |
      \begin{document}
      Our model was trained on a single NVIDIA V100 GPU for seventy two hours.
      [12] B. Author et al. GPU-accelerated solvers on the K80. Proc. IEEE, pp. 3-9, 2015.
      \end{document}
    # still enforced: reference-shaped paragraphs are dropped, so a cited title
    # saying "GPU-accelerated ..." does not become a mention
    contains: ['NVIDIA V100']
    absent: ['K80', 'B. Author']

  - name: href-keeps-text-and-url
    # pylatexenc renders \href{u}{t} as "t <u>" and \url{u} as "<u>". Both URLs are
    # kept deliberately: vendor domains are signal (the CUDA lock-in proxy in
    # notebooks/manufacturer.ipynb counts cuda/nvidia mentions), and the old parser's
    # policy of discarding the href target was a loss, not a feature.
    # `\href` also needs std_macro('href','{{') in the parse context or pylatexenc
    # raises IndexError and the whole paper is dropped -- that is what this pins.
    tex: |
      \begin{document}
      See \href{https://example.com/page}{the vendor page} for the full listing,
      and \url{https://developer.nvidia.com/cuda} for the toolkit documentation.
      \end{document}
    contains: ['the vendor page', 'developer.nvidia.com/cuda', 'example.com/page']
    # (raw source: both the href target and its text are simply present)

  - name: accents-and-control-words-untouched
    # Regression: brace-optional letter accents turned \cite{} into 'ite{}'.
    tex: |
      \begin{document}
      Following Erd\H{o}s and Ren\'{e} \cite{smith2020} we \ref{eq:1} evaluate the
      method on one NVIDIA A100 GPU, see also \usepackage-era legacy sources here.
      \end{document}
    # pylatexenc resolves accents to real unicode (Erdős, not the old ASCII Erdos),
    # which is strictly better and irrelevant to matching: hardware names are ASCII.
    # accents stay as source; nothing rewrites control words, so the class of bug
    # this case was written for cannot occur at all any more
    contains: ['NVIDIA A100', 'Erd\H{o}s', 'cite{smith2020}']

  - name: latin1-bytes-decode
    tex_latin1: |
      \begin{document}
      Schönberg and colleagues trained the network on one NVIDIA V100 GPU node.
      \end{document}
    contains: ['NVIDIA V100']

  - name: no-begin-document-1990s-source
    # Pre-2000 submissions sometimes ship a fragment with \documentstyle only.
    tex: |
      \documentstyle{article}
      Simulations were performed on a Cray and later ported to an NVIDIA GPU card.
      Timings for both platforms appear in the discussion section of this paper.
    contains: ['NVIDIA GPU', 'Timings for both platforms']

  - name: spec-table-is-searched
    tex: |
      \begin{document}
      Table~\ref{tab:hw} lists the hardware used for every reported experiment.
      \begin{tabular}{ll}
      GPU & A100 \\ Memory & 80GB \\
      \end{tabular}
      We now turn to the scaling analysis on our eight NVIDIA V100 GPU nodes.
      \end{document}
    # ACCEPTED: a hardware spec table is searched, so its A100/80GB count
    contains: ['lists the hardware', 'eight NVIDIA V100 GPU nodes', '80GB']

  - name: environment-names-appear-as-tokens
    # Found in the arXiv pilot: '\\begin' was deleted as a control word, then brace
    # stripping turned '{enumerate}' / '{IEEEkeywords}' into prose tokens.
    tex: |
      \begin{document}
      \begin{IEEEkeywords}
      neural networks, GPU computing
      \end{IEEEkeywords}
      We benchmarked the solver on one NVIDIA A100 GPU across the following cases.
      \begin{enumerate}
      \item The first configuration used a batch size of 64 for every dataset.
      \end{enumerate}
      \end{document}
    # ACCEPTED: environment names appear as source tokens. Harmless -- they are
    # not hardware aliases, so they cannot create a false mention.
    contains: ['NVIDIA A100', 'first configuration used a batch size', 'IEEEkeywords']

  - name: unbalanced-brace-after-cite-terminates
    # THE bug that killed two full-history runs: `_drop_with_args` looped
    # `while s[j] == '{': _, j = _braced(s, j)`, and `_braced` reports an
    # unbalanced group by returning its own start index -- so an unclosed
    # `\cite{` span forever, consuming one worker per bad paper. Truncated
    # source and half-written macros make this ordinary on arXiv. The test
    # times out rather than asserting output, so any regression hangs loudly.
    tex: |
      \begin{document}
      All experiments ran on four NVIDIA V100 GPUs in a single node \cite{smith2019
      \end{document}
    contains: ['four NVIDIA V100 GPUs']

  - name: unbalanced-brace-mid-document-keeps-later-prose
    # The unclosed group must not swallow the remainder: the hardware sentence
    # after it still has to reach the matcher.
    tex: |
      \begin{document}
      We first review the literature on this topic \label{sec:intro

      Our experiments were then run on eight NVIDIA A100 GPUs for three weeks.
      \end{document}
    contains: ['eight NVIDIA A100 GPUs']

  - name: unbalanced-optional-arg-after-footnote-terminates
    # The `[` optional-argument branch has the same shape: `s.find(']')` can
    # fail, and then the brace loop must still make progress.
    tex: |
      \begin{document}
      The solver was evaluated on a single NVIDIA RTX 3090 GPU \footnote[3
      \end{document}
    contains: ['NVIDIA RTX 3090']
