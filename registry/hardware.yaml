    fp32_gflops: 1382.0
    fp64_gflops: null
    fp16_tensor_gflops: null
    vram_gb: 4.0
    tdp_w: null
    spec_source: https://en.wikipedia.org/wiki/List_of_Nvidia_graphics_processing_units?oldid=1363236497#Tesla
    aliases:
    - pattern: NVIDIA S870
      case: insensitive
    - pattern: Tesla S870
      case: insensitive
    - pattern: S870
      gate: gpu
  - id: nvidia-s1070
