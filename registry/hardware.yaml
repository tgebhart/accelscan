    release: 2008-06
    release_source: https://en.wikipedia.org/wiki/List_of_Nvidia_graphics_processing_units?oldid=1363236497
    fp32_gflops: 2765.0
    fp64_gflops: 345.6
    fp16_tensor_gflops: null
    vram_gb: 4.0
    tdp_w: null
    spec_source: https://en.wikipedia.org/wiki/List_of_Nvidia_graphics_processing_units?oldid=1363236497#Tesla
    aliases:
    - pattern: NVIDIA S1075
