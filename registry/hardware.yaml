# accelscan hand-maintained registry stub.
#
# Model entries are GENERATED from Wikipedia/vendor sources by
# accelscan/scripts/build_registry.py into registry/generated/*.yaml.
# This file holds ONLY what no machine-readable source can give: the context-term
# gate vocabularies and the generic terms (GPU, CUDA, TPU, ...), which are what
# make generic-only reporting measurable. 
#
#
# Pattern conventions (enforced/expanded by accelscan/registry.py):
#   - Literal spaces in patterns compile to [\s-]* ('RTX 3090' matches
#     "RTX 3090", "RTX-3090", "RTX3090").
#   - Patterns are wrapped in (?<!\w) ... s? (?!\w) word boundaries with an
#     automatic optional plural 's'.
#   - case: auto (default) = case-sensitive when the pattern's letters are all
#     uppercase (GPU, V100, K80); case-insensitive otherwise. Override with
#     case: sensitive|insensitive.
#   - A plain string alias is shorthand for {pattern: <str>}.
#   - gate: <name> makes the alias tier B — it counts only when a
#     context_terms[<name>] regex appears in the matched paragraph or the adjacent
#     250 chars of either neighbour, or the paper has a tier-A model hit elsewhere
#     (the gate is position-independent within that window, not ±250 chars of the
#     match itself).
#   - kind: model (default) | architecture | generic.

version: "0.4.3"

context_terms:
  gpu: ["GPU", "GPUs", "GPGPU", "graphics card", "graphics cards", "video card",
        "CUDA", "cuDNN", "OpenCL", "NVIDIA", "GeForce", "Radeon", "Quadro",
        "GTX", "RTX", "VRAM", "TFLOPS", "teraflops", "accelerator", "accelerators",
        "graphics processing"]
  tpu: ["TPU", "TPUs", "tensor processing", "Cloud TPU", "Google Cloud"]
  apple: ["Apple", "MacBook", "Mac Studio", "Mac mini", "iMac", "macOS",
          "Neural Engine", "M-series"]

models:

  # ------------------------------------------------------------------
  # Hand overrides of generated entries (same id as a registry/generated/*
  # entry -- this fully replaces it, field-for-field, so every field the
  # generated entry had must be repeated here, not just the corrected ones).
  # ------------------------------------------------------------------
  - id: biren-br100
    display: Biren BR100
    manufacturer: biren
    architecture: null
    subtype: datacenter-gpu
    segment: datacenter
    release: 2022-08
    release_source: https://epoch.ai/data/machine-learning-hardware
    # Epoch.ai's "FP32"/"Tensor-FP16" columns for this row are actually
    # Biren's published TF32 (256 TFLOPS) and INT8 (1024 TOPS) marketing
    # figures, not dense FP32/BF16 -- confirmed by GFLOPS/W: 465 vs every
    # other datacenter part in the registry under ~250. This single
    # mislabeled value otherwise pins the vendor-frontier FP32 line flat
    # from 2022 on, masking the real H100->H200->B200->GB200 progression.
    # No independently-sourced dense FP32/BF16 figure is available, so both
    # are nulled (excluded from the compute-capacity axes) rather than
    # guessed.
    fp32_gflops: null
    fp64_gflops: null
    fp16_tensor_gflops: null
    vram_gb: 64.0
    tdp_w: 550.0
    spec_source: https://epoch.ai/data/machine-learning-hardware
    aliases:
    - pattern: Biren BR100
      case: insensitive
    - pattern: BR100
      gate: gpu
    notes: null
  - id: amd-mi325x
    display: AMD MI325X
    manufacturer: amd
    family: null
    architecture: cdna-3
    subtype: datacenter-gpu
    segment: datacenter
    release: '2024'
    release_source: https://en.wikipedia.org/wiki/AMD_Instinct?oldid=1361556227
    # Wikipedia's scraped figures are off by 1000x for this one row (163.4/81.7
    # read as already-GFLOPS instead of TFLOPS-needing-conversion) -- MI325X
    # shares its die with MI300X (fp32_gflops: 163400, fp64_gflops: 81700),
    # so the corrected values are copied from that entry's ratio rather than
    # left as an implausible 0.16 TFLOPS for a 256GB-HBM3e flagship part.
    fp32_gflops: 163400.0
    fp64_gflops: 81700.0
    fp16_tensor_gflops: null
    vram_gb: 256.0
    tdp_w: null
    spec_source: https://en.wikipedia.org/wiki/AMD_Instinct?oldid=1361556227
    aliases:
    - Instinct MI325X
    - pattern: AMD MI325X
      case: insensitive
    - pattern: MI325X
      gate: gpu

  # ------------------------------------------------------------------
  # Multi-GPU rackmount appliances (Tesla S-series, Quadro Plex D2/S4): each
  # houses 2 or 4 discrete GPU boards in one chassis, but the generated
  # entries' fp32/fp64/tdp figures are the WHOLE-APPLIANCE total (all GPUs
  # summed) while vram_gb is correctly per-GPU -- an internal mismatch that
  # silently set the FP32/VRAM vendor-frontier line for 2007-2016 (S1070/S2050
  # are the actual frontier-setters those years) and produces an obviously
  # wrong flat ~800-1200W "single device" TDP frontier for a decade. No
  # independently-verified per-die FLOPS/TDP split is available for hardware
  # this old, so rather than guess a /2 or /4 correction, segment is nulled:
  # these stay matchable (a paper saying "Tesla S1070" still counts as
  # accelerator use) but drop out of every segment=='datacenter' frontier calc.
  # ------------------------------------------------------------------
