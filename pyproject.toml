[project]
name = "accelscan"
version = "0.1.0"
description = "GPU/accelerator mention extraction from S2ORC full text for the GPU-diffusion-in-science paper"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "boto3>=1.34",
    "orjson>=3.9",
    "tenacity>=8.2",
    "pyahocorasick>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["vllm>=0.8"]
# Topical clustering (stage E1/E2). SPECTER2 runs on the transformers/torch
# already pulled by [gpu]; NOT `adapters` — it pins transformers<5 and breaks
# the vLLM env, so embed.py uses the base specter2 encoder.
cluster = ["bertopic>=0.16", "umap-learn>=0.5", "hdbscan>=0.8", "scikit-learn>=1.5"]
# Registry generators (Wikipedia/Epoch scrape) and the Semantic Scholar bulk
# tooling. Kept out of the core deps because stage 1 runs on EC2 with a minimal
# install and needs neither.
registry = ["pandas>=2.0", "requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0"]
s2 = ["requests>=2.31", "pandas>=2.0", "numpy>=1.26"]
# Regression analysis (notebooks/citations.ipynb). pyfixest pulls pandas, which
# is what its formula interface consumes -- accelscan.regress.to_pandas does the
# polars hand-off with numpy so no pyarrow is needed. Kept out of the core deps
# for the same reason as [registry]: stage 1 runs on EC2 with a minimal install.
analysis = ["pyfixest>=0.60"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["accelscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
