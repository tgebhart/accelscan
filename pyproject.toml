[project]
name = "accelscan"
version = "0.1.0"
description = "GPU/accelerator mention extraction from S2ORC full text for the GPU-diffusion-in-science paper"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "boto3>=1.34",
    "orjson>=3.9",
    "tenacity>=8.2",
    "pyahocorasick>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["vllm>=0.8"]
# Topical clustering (stage E1/E2). SPECTER2 runs on the transformers/torch
# already pulled by [gpu]; NOT `adapters` — it pins transformers<5 and breaks
# the vLLM env, so embed.py uses the base specter2 encoder.
cluster = ["bertopic>=0.16", "umap-learn>=0.5", "hdbscan>=0.8", "scikit-learn>=1.5"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["accelscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
